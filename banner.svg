<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">shipit agent</title>
  <desc id="d">Agents that finish the job. Open-source Python agent runtime: tools, MCP, an OS sandbox, any model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/><stop offset="50%" stop-color="#2563eb"/><stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.17)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="ar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/><stop offset="100%" stop-color="white"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#2554d6" stop-opacity="0.32"/><stop offset="100%" stop-color="#2554d6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="#111214"/>
  <rect width="1280" height="360" rx="20" fill="url(#dots)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow)"/>

  <g transform="translate(72 72) scale(1.25)">
    <rect width="64" height="64" rx="15" fill="url(#bg)"/>
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.5" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.2"/>
    <rect x="0.75" y="0.75" width="62.5" height="29" rx="14" fill="url(#sh)"/>
    <rect x="0" y="50" width="64" height="14" rx="15" fill="rgba(0,0,30,0.13)"/>
    <circle cx="9" cy="32" r="3" fill="rgba(255,255,255,0.18)"/>
    <circle cx="17" cy="32" r="3.2" fill="rgba(255,255,255,0.4)"/>
    <circle cx="25" cy="32" r="3.5" fill="rgba(255,255,255,0.65)"/>
    <line x1="29" y1="32" x2="46" y2="32" stroke="url(#ar)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M38 22.5 L50 32 L38 41.5" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="176" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#f2f3f5" letter-spacing="-1.5">shipit<tspan dx="14" font-family="'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-style="italic" font-weight="400" fill="#9db4ff">agent</tspan></text>

  <text x="74" y="214" font-family="'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="38" fill="#f2f3f5">Agents that <tspan font-style="italic" fill="#9db4ff">finish</tspan> the job.</text>
  <text x="74" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9a9ea8">Open-source Python runtime: tools, MCP, an OS sandbox, any model.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="74" y="280" width="74" height="28" rx="14" fill="rgba(37,84,214,0.18)" stroke="rgba(157,180,255,0.35)"/>
    <text x="111" y="299" text-anchor="middle" fill="#9db4ff">v3.0.0</text>
    <rect x="158" y="280" width="112" height="28" rx="14" fill="none" stroke="rgba(255,255,255,0.14)"/>
    <text x="214" y="299" text-anchor="middle" fill="#c9ccd3">Python 3.11+</text>
    <rect x="280" y="280" width="54" height="28" rx="14" fill="none" stroke="rgba(255,255,255,0.14)"/>
    <text x="307" y="299" text-anchor="middle" fill="#c9ccd3">MIT</text>
    <rect x="344" y="280" width="236" height="28" rx="14" fill="none" stroke="rgba(255,255,255,0.14)"/>
    <text x="462" y="299" text-anchor="middle" fill="#c9ccd3">Claude Agent SDK compatible</text>
  </g>

  <g transform="translate(726 64)">
    <rect width="486" height="232" rx="14" fill="#16181d" stroke="rgba(255,255,255,0.09)"/>
    <circle cx="22" cy="22" r="5" fill="rgba(255,255,255,0.18)"/><circle cx="40" cy="22" r="5" fill="rgba(255,255,255,0.18)"/><circle cx="58" cy="22" r="5" fill="rgba(255,255,255,0.18)"/>
    <text x="466" y="26" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6b7080">agent.py</text>
    <line x1="0" y1="44" x2="486" y2="44" stroke="rgba(255,255,255,0.07)"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#c9ccd3">
      <text x="22" y="76"><tspan fill="#9db4ff">from</tspan> shipit_agent <tspan fill="#9db4ff">import</tspan> Agent</text>
      <text x="22" y="98"><tspan fill="#9db4ff">from</tspan> shipit_agent.llms <tspan fill="#9db4ff">import</tspan> build_llm_from_env</text>
      <text x="22" y="134">agent = Agent.with_builtins(</text>
      <text x="56" y="156">llm=build_llm_from_env(), project_root=<tspan fill="#8fd6a4">"."</tspan></text>
      <text x="22" y="178">)</text>
      <text x="22" y="208"><tspan fill="#9db4ff">for</tspan> event <tspan fill="#9db4ff">in</tspan> agent.stream(<tspan fill="#8fd6a4">"Fix the failing test"</tspan>):</text>
    </g>
  </g>
</svg>
