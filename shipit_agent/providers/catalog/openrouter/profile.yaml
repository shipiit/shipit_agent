profile_version: 1
name: openrouter
display_name: OpenRouter
description: One key for hundreds of models from many providers.
icon: "🧭"
adapter: shipit_agent.llms.litellm_adapter:LiteLLMChatLLM
default_model: ""
model_keys: [model, SHIPIT_OPENROUTER_MODEL]
model_env: [SHIPIT_OPENROUTER_MODEL]
require_env: [OPENROUTER_API_KEY]
capabilities: {vision: false, prompt_cache: false}
signup_url: https://openrouter.ai/keys
env_help: 'Set OPENROUTER_API_KEY and SHIPIT_OPENROUTER_MODEL (e.g. "openrouter/<vendor>/<model>").'
