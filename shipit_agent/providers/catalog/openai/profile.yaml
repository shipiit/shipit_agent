profile_version: 1
name: openai
display_name: OpenAI
description: GPT-4o and o-series models via the OpenAI API.
icon: "🟢"
adapter: shipit_agent.llms.openai_adapter:OpenAIChatLLM
default_model: gpt-4o-mini
model_keys: [model, SHIPIT_OPENAI_MODEL]
model_env: [SHIPIT_OPENAI_MODEL]
require_env: [OPENAI_API_KEY]
capabilities: {vision: true, prompt_cache: true}
fallback_models: [gpt-4o]
signup_url: https://platform.openai.com/api-keys
env_help: Set OPENAI_API_KEY.
