<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Accents -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>

    <!-- Pattern + filter -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.045"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- Layered background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Glow accents -->
  <circle cx="200" cy="80"  r="120" fill="#3b82f6" opacity="0.18" filter="url(#blur)"/>
  <circle cx="950" cy="240" r="140" fill="#34d399" opacity="0.10" filter="url(#blur)"/>
  <circle cx="600" cy="160" r="180" fill="#a78bfa" opacity="0.05" filter="url(#blur)"/>

  <!-- ==== Left half — brand block ==== -->

  <!-- Logo mark -->
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#brand)"/>
    <rect x="0" y="0" width="64" height="64" rx="16" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="32" y="46" font-family="ui-serif, Georgia, serif" font-size="36" font-weight="700"
          text-anchor="middle" fill="#ffffff">S</text>
  </g>

  <!-- Title -->
  <text x="170" y="124" font-family="ui-serif, Georgia, serif" font-size="48" font-weight="800"
        fill="url(#title-grad)" letter-spacing="-1.2">
    SHIPIT Agent<tspan fill="#60a5fa">.</tspan>
  </text>

  <!-- Tagline -->
  <text x="170" y="158" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="500"
        fill="#cbd5e1">
    Production-grade Python agent runtime.
  </text>
  <text x="170" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400"
        fill="#64748b">
    Bring your own LLM. Compose tools, MCP, RAG, autopilot. Ship anything.
  </text>

  <!-- Accent gradient line -->
  <line x1="170" y1="202" x2="540" y2="202" stroke="url(#line-grad)" stroke-width="1.5"/>

  <!-- Version + meta row -->
  <g transform="translate(170,218)" font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- v1.0.8 chip -->
    <rect x="0" y="0" width="64" height="22" rx="11" fill="rgba(59,130,246,0.14)" stroke="rgba(59,130,246,0.35)" stroke-width="1"/>
    <text x="32" y="15" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="0.5">v1.0.8</text>

    <!-- Python chip -->
    <rect x="74" y="0" width="56" height="22" rx="11" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="102" y="15" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.5">Python</text>

    <!-- MIT chip -->
    <rect x="140" y="0" width="42" height="22" rx="11" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="161" y="15" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.5">MIT</text>

    <!-- Self-hosted chip -->
    <rect x="192" y="0" width="92" height="22" rx="11" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="238" y="15" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.5">Self-hosted</text>
  </g>

  <!-- Pip install line -->
  <text x="170" y="270" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="13" font-weight="500"
        fill="#475569">
    $ <tspan fill="#94a3b8">pip install</tspan> <tspan fill="#60a5fa">shipit-agent</tspan>
  </text>

  <!-- ==== Right half — code window mockup ==== -->

  <g transform="translate(720,72)">
    <!-- Window frame -->
    <rect x="0" y="0" width="400" height="200" rx="14" fill="rgba(255,255,255,0.025)"
          stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="400" height="32" rx="14" fill="rgba(255,255,255,0.02)"/>
    <rect x="0" y="18" width="400" height="14" fill="rgba(255,255,255,0.02)"/>
    <line x1="0" y1="32" x2="400" y2="32" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

    <!-- Window dots -->
    <circle cx="20" cy="16" r="5" fill="#fb7185" opacity="0.55"/>
    <circle cx="38" cy="16" r="5" fill="#fbbf24" opacity="0.55"/>
    <circle cx="56" cy="16" r="5" fill="#34d399" opacity="0.55"/>

    <!-- Filename label -->
    <text x="350" y="20" font-family="ui-monospace, monospace" font-size="10" font-weight="500"
          fill="#475569" text-anchor="middle">agent.py</text>

    <!-- Code lines -->
    <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" letter-spacing="0">
      <text x="22" y="62" fill="#a78bfa">from</text>
      <text x="60" y="62" fill="#cbd5e1"> shipit_agent </text>
      <text x="170" y="62" fill="#a78bfa">import</text>
      <text x="218" y="62" fill="#cbd5e1"> Agent</text>

      <text x="22" y="82" fill="#a78bfa">from</text>
      <text x="60" y="82" fill="#cbd5e1"> shipit_agent.verifier </text>
      <text x="208" y="82" fill="#a78bfa">import</text>
      <text x="258" y="82" fill="#7dd3fc">VerifierNetwork</text>

      <text x="22" y="118" fill="#7dd3fc">agent</text>
      <text x="62" y="118" fill="#f472b6">=</text>
      <text x="74" y="118" fill="#7dd3fc">Agent</text>
      <text x="106" y="118" fill="#cbd5e1">(</text>

      <text x="38" y="138" fill="#cbd5e1">llm=opus_llm,</text>
      <text x="38" y="158" fill="#34d399">verifier</text>
      <text x="92" y="158" fill="#f472b6">=</text>
      <text x="102" y="158" fill="#7dd3fc">VerifierNetwork</text>
      <text x="208" y="158" fill="#cbd5e1">(</text>
      <text x="216" y="158" fill="#fbbf24">...</text>
      <text x="234" y="158" fill="#cbd5e1">),</text>
      <text x="22" y="178" fill="#cbd5e1">)</text>
    </g>

    <!-- Subtle status bar -->
    <line x1="0" y1="200" x2="400" y2="200" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </g>

  <!-- ==== Bottom — power feature chips ==== -->

  <g transform="translate(80,290)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">
    <text x="0" y="-2" font-size="10" fill="#475569" letter-spacing="2" font-weight="700">v1.0.8 ·</text>

    <!-- Pill 1 -->
    <g transform="translate(60,-12)">
      <rect x="0" y="0" width="138" height="20" rx="10" fill="rgba(52,211,153,0.10)" stroke="rgba(52,211,153,0.30)" stroke-width="0.8"/>
      <circle cx="11" cy="10" r="2.2" fill="#34d399"/>
      <text x="20" y="13" fill="#34d399">Structured output</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(208,-12)">
      <rect x="0" y="0" width="116" height="20" rx="10" fill="rgba(251,113,133,0.10)" stroke="rgba(251,113,133,0.30)" stroke-width="0.8"/>
      <circle cx="11" cy="10" r="2.2" fill="#fb7185"/>
      <text x="20" y="13" fill="#fb7185">Verifier network</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(334,-12)">
      <rect x="0" y="0" width="156" height="20" rx="10" fill="rgba(167,139,250,0.10)" stroke="rgba(167,139,250,0.30)" stroke-width="0.8"/>
      <circle cx="11" cy="10" r="2.2" fill="#a78bfa"/>
      <text x="20" y="13" fill="#a78bfa">Memory consolidation</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(500,-12)">
      <rect x="0" y="0" width="132" height="20" rx="10" fill="rgba(56,189,248,0.10)" stroke="rgba(56,189,248,0.30)" stroke-width="0.8"/>
      <circle cx="11" cy="10" r="2.2" fill="#38bdf8"/>
      <text x="20" y="13" fill="#38bdf8">Time-travel replay</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(642,-12)">
      <rect x="0" y="0" width="156" height="20" rx="10" fill="rgba(251,191,36,0.10)" stroke="rgba(251,191,36,0.30)" stroke-width="0.8"/>
      <circle cx="11" cy="10" r="2.2" fill="#fbbf24"/>
      <text x="20" y="13" fill="#fbbf24">ComputerUseAgent</text>
    </g>
  </g>
</svg>
