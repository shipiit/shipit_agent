# google-maps — shipit connector manifest
manifest_version: 1
name: google-maps
description: Places, directions and geocoding via Google Maps.
category: data
icon: 🗺️
transport:
  type: stdio
  command: npx -y @modelcontextprotocol/server-google-maps
auth:
  type: api_key
  env:
  - name: GOOGLE_MAPS_API_KEY
    secret: true
    required: true
suggest:
  keywords:
  - maps
  - directions
  - geocode
