name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q --tb=short

      - name: Smoke-test package import
        run: |
          python -c "
          from shipit_agent import Agent, ToolSearchTool
          from shipit_agent.llms import (
              OpenAIChatLLM, AnthropicChatLLM, BedrockChatLLM,
              GeminiChatLLM, VertexAIChatLLM, GroqChatLLM,
              TogetherChatLLM, OllamaChatLLM, LiteLLMChatLLM,
              LiteLLMProxyChatLLM, SimpleEchoLLM,
          )
          print('All adapters importable')
          tool = ToolSearchTool()
          assert 'limit' in tool.schema()['function']['parameters']['properties']
          print('ToolSearchTool schema has limit field')
          "
