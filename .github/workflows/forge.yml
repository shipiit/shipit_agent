# ShipIT Forge — auto-review every pull request on this repo.
#
# Scoped to PRs: it reviews new PRs and new commits, and answers /review,
# /security and @shipit-forge comments on a PR. It never approves or merges.
#
# ─────────────────────────────────────────────────────────────────────────────
# CONFIGURATION — Settings → Secrets and variables → Actions
#
# A .env file does NOT work here. Actions never reads a file from the repository
# for credentials, and .env is gitignored precisely so it cannot be committed.
# .env is for running the agent on your own machine (`forge run`, `forge fix`);
# CI reads repository secrets instead.
#
# Add these two (Vertex, which is what this repo uses):
#
# Four required Secrets. Named for this project rather than for one vendor, so
# swapping provider is a settings change and not a workflow edit:
#
#   SHIPIT_PROVIDER     vertex | anthropic | openai | gemini | bedrock | groq |
#                       together | ollama | openai-compatible
#   SHIPIT_MODEL        the model id for that provider, e.g. gemini-2.5-flash
#   SHIPIT_CREDENTIALS  the key, or the whole service-account JSON for Vertex
#
# Vertex also needs, because the API is addressed by project and region:
#
#   SHIPIT_PROJECT      GCP project id
#   SHIPIT_LOCATION     region, e.g. us-central1
#
# And an OpenAI-compatible endpoint — Hetzner inference, vLLM, LiteLLM, LM
# Studio, anything serving /v1/chat/completions — needs where to send it:
#
#   SHIPIT_BASE_URL     the /v1 root, e.g. https://<host>/v1
#
# Nothing is defaulted here. A model hardcoded in this file is one somebody
# changes in the settings page and then wonders why the run ignored them.
#
# Security scanning needs no credential at all. The secret and code scans are
# deterministic — no model call, no cost — and run on every pull request even
# if the review itself is switched off.
#
# Optional, and worth adding — without them every review is posted by
# "github-actions[bot]" rather than by your app:
#
#   FORGE_APP_ID       the GitHub App's numeric id (Settings → Developer settings)
#   FORGE_PRIVATE_KEY  that app's private key, the whole PEM including headers
#
# Using a different provider? Add its key as a secret and swap the two marked
# lines below:
#
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THE `if:` BELOW IS NOT OPTIONAL — this repository is public
#
# GitHub protects secrets from `pull_request` events on forks: a fork PR gets
# no secrets, so a stranger's PR cannot read them. That protection does NOT
# extend to `issue_comment`. Comment events run the workflow from the default
# branch WITH secrets, whoever wrote the comment.
#
# On a public repository that means any person on the internet could comment
# "/review" and start a run that spends your model credits — and, on a fix or
# mention, clones a branch and runs its tests with GITHUB_TOKEN (contents:
# write) in the environment. That is the "pwn request" pattern, and it ends in
# a push to your repository.
#
# So every job below is gated on author_association: only the owner, an
# organization member, or a collaborator can set the agent off, and only
# same-repository pull requests are reviewed. Removing that gate on a public
# repository hands your token and your credits to anyone with a keyboard.
# ─────────────────────────────────────────────────────────────────────────────

name: ShipIT Forge (PR review)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

# Nothing at the workflow level. Every job declares what it needs, so the
# gate — which decides whether an untrusted actor gets a run at all — cannot
# write anything, and a job added later starts from no permissions rather
# than inheriting write on the repository.
#
# Forge flagged this on its own pull request, and it was right: workflow-wide
# `checks: write` on every pull_request event is a broader grant than the one
# job that publishes a check run needs.
permissions: {}

concurrency:
  group: forge-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # The gate is its own job so it can say why it declined. As a one-line `if:`
  # on the work itself, a skipped run is indistinguishable from a broken
  # expression, and there is nothing in the log to tell them apart.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.event.sender.login }}
          ASSOC: ${{ github.event.comment.author_association }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
        run: |
          allowed=false
          if [ "$EVENT" = "pull_request" ]; then
            # A fork PR gets no secrets anyway; declining quietly here keeps
            # every drive-by pull request from failing loudly.
            [ "$HEAD_REPO" = "$THIS_REPO" ] && allowed=true
            detail="head=$HEAD_REPO"
          else
            # Ask what this account may actually do. author_association reports
            # MEMBER only when organization membership is PUBLIC — with private
            # membership an owner arrives as CONTRIBUTOR, which is not a
            # permission at all: one merged pull request earns it forever.
            perm=$(gh api "repos/$THIS_REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo "unknown")
            case "$perm" in admin|maintain|write) allowed=true ;; esac
            if [ "$perm" = "unknown" ]; then
              case "$ASSOC" in OWNER|MEMBER|COLLABORATOR) allowed=true ;; esac
            fi
            # issue_comment fires for plain issues too; those are the other workflow.
            [ "$EVENT" = "issue_comment" ] && [ "$IS_PR_COMMENT" != "true" ] && allowed=false
            detail="permission=$perm association=$ASSOC on_pull_request=$IS_PR_COMMENT"
          fi

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "::notice::event=$EVENT actor=$ACTOR $detail -> allowed=$allowed"
          if [ "$allowed" != "true" ]; then
            echo "::notice::Declined. Same-repository pull requests, or a comment from someone with write access."
          fi

  review:
    permissions:
      contents: write # clone, and push a fix branch
      pull-requests: write # post the review and its inline comments
      issues: write # comment on the issue a fix closes
      # The scan publishes a check run, and a check run is what turns a
      # finding into a merge gate once you mark it required. With read it
      # fails quietly and the gate simply does not exist.
      checks: write
      statuses: read
      # Not `security-events: read` — that was tried and does not help.
      # GITHUB_TOKEN cannot read Dependabot alerts at any permission level;
      # the call 403s regardless. Reading them needs a GitHub App installed on
      # the repository with the "Dependabot alerts: read" permission, supplied
      # as FORGE_APP_ID and FORGE_PRIVATE_KEY below. Until then Forge reviews
      # without them, which is the right failure — just a quieter review.
      actions: write # read failed-job logs for the CI auto-fix
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest

    steps:
      # Say what is missing, in one line, before spending three minutes getting
      # an authentication error from inside the container.
      - name: Check credentials are configured
        env:
          PROVIDER: ${{ secrets.SHIPIT_PROVIDER }}
          MODEL: ${{ secrets.SHIPIT_MODEL }}
          CREDENTIALS: ${{ secrets.SHIPIT_CREDENTIALS }}
          PROJECT: ${{ secrets.SHIPIT_PROJECT }}
          LOCATION: ${{ secrets.SHIPIT_LOCATION }}
          BASE_URL: ${{ secrets.SHIPIT_BASE_URL }}
        run: |
          # Actions runs this as `bash -e`, so an `[ -z X ] && y=z` one-liner
          # exits the step the moment the secret IS set — the happy path.
          # Written long, because a config check that fails when the config is
          # correct is worse than no check.
          missing=""
          for name in PROVIDER MODEL CREDENTIALS; do
            eval "value=\$$name"
            if [ -z "$value" ]; then missing="$missing SHIPIT_$name"; fi
          done
          # Vertex is addressed by project and region; no other provider is.
          if [ "$PROVIDER" = "vertex" ]; then
            if [ -z "$PROJECT" ];  then missing="$missing SHIPIT_PROJECT"; fi
            if [ -z "$LOCATION" ]; then missing="$missing SHIPIT_LOCATION"; fi
          fi
          # An OpenAI-compatible endpoint has no well-known host, so there is
          # nothing sensible to default the base URL to.
          if [ "$PROVIDER" = "openai-compatible" ] && [ -z "$BASE_URL" ]; then
            missing="$missing SHIPIT_BASE_URL"
          fi
          if [ -n "$missing" ]; then
            echo "::error::ShipIT Forge is not configured. Missing:$missing"
            echo "::error::Add them under Settings → Secrets and variables → Actions. Actions does not read a .env file."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: shipiit/forge@v2
        with:
          provider: ${{ secrets.SHIPIT_PROVIDER }}
          model: ${{ secrets.SHIPIT_MODEL }}
          # One credential secret, offered to whichever provider is selected.
          # The unused ones are ignored, so switching provider never means
          # editing this file.
          vertex-credentials-json: ${{ secrets.SHIPIT_CREDENTIALS }}
          anthropic-api-key: ${{ secrets.SHIPIT_CREDENTIALS }}
          openai-api-key: ${{ secrets.SHIPIT_CREDENTIALS }}
          gemini-api-key: ${{ secrets.SHIPIT_CREDENTIALS }}
          github-token: ${{ github.token }}
          # Optional. With these, comments and reviews come from your GitHub
          # App — "ShipIT Forge" — instead of github-actions[bot], which is
          # what the identity on a review should say. Without them it still
          # works, just under the runner's own bot.
          app-id: ${{ secrets.FORGE_APP_ID }}
          private-key: ${{ secrets.FORGE_PRIVATE_KEY }}
          skill: code-review
          # What this repository cares about, said once here rather than
          # rediscovered on every pull request.
          prompt: >-
            This is SHIPIT Agent, a Python runtime for tool-using AI agents:
            Python 3.11+, published on PyPI as shipit-agent, tests under
            tests/ run with pytest.

            Weigh these above style. (1) A tool call must never take the
            process down: a tool that raises, hangs or loops has to be
            contained by the runtime, because an agent that dies mid-run
            leaves the caller with nothing. (2) The permission layer decides
            what an agent may do — a path that reaches a side effect without
            passing it is a hole, not a shortcut. (3) Provider adapters must
            stay interchangeable: anything that only works on one provider
            belongs behind the adapter, not in the loop. (4) Context passed
            through contextvars must survive threads, tasks and generators.
            (5) A new required runtime dependency is a breaking change for a
            zero-dependency-by-default package — say so.

            Assume 3.11 syntax is fine and do not suggest backports.
          max-turns: '30'
          max-nits: '5'
          # Both scans are on by default; they are written out here so it is
          # visible in the workflow that they run, and obvious where to turn
          # one off. They cost no model call, so they run on every pull
          # request regardless of the review cadence below.
          secret-scan: '1'
          code-scan: '1'
        env:
          # Providers whose settings have no action input. Each is read only
          # by the provider it belongs to, so all of them can be present and
          # only the selected one takes effect — which is what makes switching
          # provider a change to SHIPIT_PROVIDER and nothing else.
          #
          # Vertex is addressed by project and region:
          VERTEX_PROJECT: ${{ secrets.SHIPIT_PROJECT }}
          VERTEX_LOCATION: ${{ secrets.SHIPIT_LOCATION }}
          # Any OpenAI-compatible endpoint — Hetzner inference, vLLM, LiteLLM,
          # a self-hosted Qwen — is a base URL, a key and a model id:
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.SHIPIT_BASE_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.SHIPIT_CREDENTIALS }}
          OPENAI_COMPATIBLE_MODEL: ${{ secrets.SHIPIT_MODEL }}
          # Hosted gateways that read their key from the environment:
          GROQ_API_KEY: ${{ secrets.SHIPIT_CREDENTIALS }}
          TOGETHER_API_KEY: ${{ secrets.SHIPIT_CREDENTIALS }}
          # Cost controls. The cap is enforced inside the loop — it stops
          # before the turn that would cross it, rather than reporting an
          # overspend afterwards — and caching is what makes a long review
          # affordable, so it stays on.
          FORGE_SPEND_CAP_RUN: '0.50'
          FORGE_MAX_RUNS_PER_HOUR: '10'
          FORGE_PROMPT_CACHE: '1'
          FORGE_AUTO_REVIEW: always
          GITHUB_TOKEN: ${{ github.token }}
